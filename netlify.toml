[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "20.19.0"
  NPM_FLAGS = "--no-fund --no-audit"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

